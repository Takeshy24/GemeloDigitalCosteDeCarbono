services:
  langflow:
    image: langflowai/langflow:1.12.0
    container_name: carbon-twin-langflow
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      LANGFLOW_AUTO_LOGIN: "true"
      LANGFLOW_CONFIG_DIR: /app/langflow
      LANGFLOW_API_KEY_SOURCE: env
      LANGFLOW_FALLBACK_TO_ENV_VAR: "true"
      LANGFLOW_TWEAKS_POLICY: "off"
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - langflow-data:/app/langflow

volumes:
  langflow-data:
