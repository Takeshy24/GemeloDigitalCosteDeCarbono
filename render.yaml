# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Demo Free con SQLite temporal. Los datos se pierden al reiniciar/suspender.
services:
  - type: web
    name: carbon-twin-ap9
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        value: sqlite:////tmp/carbon-twin-demo.db
      - key: ML_TRAINING_ENABLED
        value: "false"
