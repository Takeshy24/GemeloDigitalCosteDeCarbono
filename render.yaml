# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
# Demo Free: PostgreSQL vence a los 30 días; sin discos ni planes de pago.
services:
  - type: web
    name: carbon-twin-ap9
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: carbon-twin-db
          property: connectionString
      - key: ML_TRAINING_ENABLED
        value: "false"
databases:
  - name: carbon-twin-db
    region: oregon
    plan: free
    databaseName: carbon_twins
    user: carbon_user
    postgresMajorVersion: "16"
    ipAllowList: []
