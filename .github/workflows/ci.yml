name: Validate Render deployment
on:
  pull_request:
  push:
    branches: [main, codex/render-deployment]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --include=dev
      - run: npm run lint
      - run: npm run build
        env:
          API_HOSTPORT: localhost:8000
          NEXT_TELEMETRY_DISABLED: '1'
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: carbon_twin_test
          POSTGRES_USER: carbon_test
          POSTGRES_PASSWORD: test_only_password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://carbon_test:test_only_password@localhost:5432/carbon_twin_test
      TEST_DATABASE_URL: postgresql://carbon_test:test_only_password@localhost:5432/carbon_twin_test
      ML_TRAINING_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt
      - run: pip install -r backend/requirements-runtime.txt pytest pyyaml jsonschema
      - run: python -m pytest backend/tests -q
      - run: python scripts/validate_render.py
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.render -t carbon-twin-render:test .
